name: CI/CD Automation Pipeline

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: 1.10.0

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    outputs:
      ec2_host: ${{ steps.ec2_host.outputs.host }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug Repository
        run: |
          echo "Current Directory:"
          pwd

          echo "Terraform Files:"
          find terraform -type f \( -name "*.tf" -o -name "*.tfvars" \)

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false

      - name: Terraform Apply
        # if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false

      - name: Get EC2 Host
        id: ec2_host
        working-directory: ./terraform
        run: |
          HOST=$(terraform output -json instance_public_ips | jq -r '.[0]')
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "EC2 Host: $HOST"

  deploy:
    name: Deploy TransDoo to EC2
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deploy.sh to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.ec2_host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "deploy.sh"
          target: "/home/ubuntu"

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ needs.terraform.outputs.ec2_host }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            cd /home/ubuntu
            chmod +x deploy.sh
            ./deploy.sh