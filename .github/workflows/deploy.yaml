name: CI/CD Automation Pipeline

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: 1.10.0

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug Repository
        run: |
          echo "Current Directory:"
          pwd

          echo "Terraform Files:"
          find terraform -type f \( -name "*.tf" -o -name "*.tfvars" \)

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Import existing Terraform resources
        working-directory: ./terraform
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text)

          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=transdoo-ec2" "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[0].GroupId" \
            --output text)

          if ! terraform state list | grep -qx 'module.ec2.aws_key_pair.ec2_keys'; then
            terraform import module.ec2.aws_key_pair.ec2_keys ec2_key
          fi

          if ! terraform state list | grep -qx 'module.ec2.aws_default_vpc.default'; then
            terraform import module.ec2.aws_default_vpc.default "$VPC_ID"
          fi

          if ! terraform state list | grep -qx 'module.ec2.aws_security_group.ec2_sg'; then
            terraform import module.ec2.aws_security_group.ec2_sg "$SECURITY_GROUP_ID"
          fi

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false

      - name: Terraform Apply
        # if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false

  deploy:
    name: Deploy TransDoo to EC2
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu

            if [ ! -f deploy.sh ]; then
              echo "❌ deploy.sh not found"
              exit 1
            fi

            chmod +x deploy.sh

            ./deploy.sh
