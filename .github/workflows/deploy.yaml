name: CI/CD Automation Pipeline

on:
  push:
    branches:
     - dev

jobs:
  terraform:
  name: Terraform Plan
  runs-on: ubuntu-latest

  steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3
    with:
        terraform_version: ${{ env.TF_VERSION }}

  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

  - name: Debug Repository
    run: |
        echo "Current Directory:"
        pwd
        echo ""
        echo "Repository Files:"
        ls -la
        echo ""
        echo "Terraform Files:"
        find . -name "*.tf" -o -name "*.tfvars"

  - name: Terraform Init
    run: terraform init

  - name: Terraform Format Check
    run: terraform fmt -check

  - name: Terraform Validate
    run: terraform validate

  - name: Terraform Plan
    run: terraform plan -input=false -var-file=terraform.tfvars

  - name: Terraform Apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    run: terraform apply -auto-approve -input=false -var-file=terraform.tfvars