apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-dep
  namespace: transdoo-ns
  labels:
    app: tr-front

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tr-front

  template:
    metadata:
      labels:
         app: tr-front

    spec:    
      containers:
       - name:  transdoo-frontend
         image: 3453458134/transdoo-frontend

         ports:
           - containerPort: 3000

         env:
           - name: VITE_API_URL
             value: "http://54.206.214.242:8000"    
