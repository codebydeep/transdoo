apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-dep
  namespace: transdoo-ns
  labels:
    app: tr-back

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tr-back

  template:
    metadata:
      labels:
        app: tr-back

    spec:
      containers:
        - name: transdoo-backend
          image: 3453458134/transdoo-backend

          ports:
            - containerPort: 8000

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "8000"

            - name: DB_HOST
              value: "mysql-svc"

            - name: DB_PORT
              value: "3306"

            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: back-secrets
                  key: DB_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: back-secrets
                  key: DB_NAME

            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: back-secrets
                  key: CORS_ORIGIN

            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: back-secrets
                  key: JWT_ACCESS_SECRET

            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: back-secrets
                  key: JWT_REFRESH_SECRET
